services:
  OL-arts:
    image: postgres:18
    container_name: olarts-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ПАРОЛЬ
      POSTGRES_DB: Testdb
    ports:
      - "5433:5433"
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: